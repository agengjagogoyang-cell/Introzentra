name: Build ZentraIntro

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: |
          set -e
          POM_PATH=$(find . -maxdepth 3 -name "pom.xml" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "Error: pom.xml tidak ditemukan di repository ini."
            echo "Isi folder saat ini:"
            ls -la
            exit 1
          fi
          echo "Menggunakan POM: $POM_PATH"
          mvn -B -f "$POM_PATH" clean package

      - name: Upload ZentraIntro.jar
        uses: actions/upload-artifact@v4
        with:
          name: ZentraIntro-jar
          path: |
            **/target/ZentraIntro.jar
            target/ZentraIntro.jar
          if-no-files-found: error
